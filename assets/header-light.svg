<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Emre Dikmen — Founder &amp; CEO, SilverOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8F9"/>
      <stop offset="1" stop-color="#EDEFF1"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242A"/>
      <stop offset="0.5" stop-color="#33383F"/>
      <stop offset="1" stop-color="#4A5058"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20242A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#20242A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif{font-family:Georgia,"Times New Roman","Noto Serif",serif;}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;}
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- faint watermark initials -->
  <text x="884" y="196" text-anchor="end" class="serif" font-size="230" fill="#000000" fill-opacity="0.032" letter-spacing="-6">ED</text>

  <!-- left signage rail -->
  <rect x="40" y="46" width="1" height="128" fill="#000000" fill-opacity="0.14"/>
  <rect x="40" y="46" width="3" height="22" fill="#33383F" fill-opacity="0.7"/>

  <!-- kicker -->
  <text x="64" y="64" class="mono" font-size="12.5" letter-spacing="3.4" fill="#6A717A">FOUNDER / CEO — SILVEROPS</text>

  <!-- top-right locus -->
  <text x="860" y="64" text-anchor="end" class="mono" font-size="11" letter-spacing="2.6" fill="#9098A1">İSTANBUL · TR</text>

  <!-- name -->
  <text x="62" y="128" class="serif" font-size="62" letter-spacing="1.5" fill="url(#graphite)">EMRE DİKMEN</text>

  <!-- hairline draw-in -->
  <line x1="64" y1="150" x2="540" y2="150" stroke="url(#rule)" stroke-width="1" stroke-dasharray="476" stroke-dashoffset="476">
    <animate attributeName="stroke-dashoffset" from="476" to="0" dur="1.15s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1" values="476;0"/>
  </line>

  <!-- sub line -->
  <text x="64" y="178" class="mono" font-size="13.5" letter-spacing="0.3" fill="#5A616B">EmreDs · production engineering · security · AI · 17 years shipping</text>
</svg>
