<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Emre Dikmen — Founder &amp; CEO, SilverOps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0E11"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F6F8"/>
      <stop offset="0.5" stop-color="#CBCFD5"/>
      <stop offset="1" stop-color="#9AA0A8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EBEE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E9EBEE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .serif{font-family:Georgia,"Times New Roman","Noto Serif",serif;}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;}
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- faint watermark initials -->
  <text x="884" y="196" text-anchor="end" class="serif" font-size="230" fill="#FFFFFF" fill-opacity="0.028" letter-spacing="-6">ED</text>

  <!-- left signage rail -->
  <rect x="40" y="46" width="1" height="128" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="40" y="46" width="3" height="22" fill="#C9CDD3" fill-opacity="0.65"/>

  <!-- kicker -->
  <text x="64" y="64" class="mono" font-size="12.5" letter-spacing="3.4" fill="#8B929B">FOUNDER / CEO — SILVEROPS</text>

  <!-- top-right locus -->
  <text x="860" y="64" text-anchor="end" class="mono" font-size="11" letter-spacing="2.6" fill="#5B626C">İSTANBUL · TR</text>

  <!-- name -->
  <text x="62" y="128" class="serif" font-size="62" letter-spacing="1.5" fill="url(#silver)">EMRE DİKMEN</text>

  <!-- hairline draw-in -->
  <line x1="64" y1="150" x2="540" y2="150" stroke="url(#rule)" stroke-width="1" stroke-dasharray="476" stroke-dashoffset="476">
    <animate attributeName="stroke-dashoffset" from="476" to="0" dur="1.15s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1" values="476;0"/>
  </line>

  <!-- sub line -->
  <text x="64" y="178" class="mono" font-size="13.5" letter-spacing="0.3" fill="#9BA1AA">EmreDs · production engineering · security · AI · 17 years shipping</text>
</svg>
